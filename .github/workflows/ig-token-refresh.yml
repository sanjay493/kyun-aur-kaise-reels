# Instagram long-lived tokens expire after 60 days. This refreshes it every week and stores
# the new one back in the IG_ACCESS_TOKEN secret. Needs a GH_PAT secret: a fine-grained
# personal access token for this repo with "Secrets: Read and write" permission.
name: Refresh Instagram token

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 08:30 IST
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh and store token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::GH_PAT secret missing"; exit 1; fi
          RESP=$(curl -sS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_ACCESS_TOKEN")
          NEW=$(echo "$RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))')
          if [ -z "$NEW" ]; then
            echo "::error::Refresh failed: $(echo "$RESP" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("error",{}).get("message","unknown"))')"
            exit 1
          fi
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW"
          echo "Token refreshed (valid for another 60 days)."
