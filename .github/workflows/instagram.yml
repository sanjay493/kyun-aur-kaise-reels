# Renders new videos when the daily batch is pushed, then posts one Reel at each slot.
# Slots (IST): 08:00, 12:00, 17:00, 20:00. GitHub cron runs in UTC and can start a few minutes late.
name: Instagram

on:
  push:
    branches: [main]
    paths: ["videos/**", "docs/posts/**"]
  schedule:
    - cron: "30 2 * * *"    # 08:00 IST
    - cron: "30 6 * * *"    # 12:00 IST
    - cron: "30 11 * * *"   # 17:00 IST
    - cron: "30 14 * * *"   # 20:00 IST
  workflow_dispatch:
    inputs:
      action:
        description: "queue = render new videos, post = publish the next queued Reel now"
        type: choice
        options: [queue, post]
        default: post

permissions:
  contents: write   # upload release assets and commit docs/instagram.csv

jobs:
  queue:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'queue')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency: { group: ig-queue, cancel-in-progress: false }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System packages and fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core
          D=/usr/share/fonts/truetype/google-fonts
          sudo mkdir -p $D
          for w in Bold SemiBold Medium; do
            sudo curl -sSfL -o $D/Poppins-$w.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf
          done
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - run: bash setup.sh
      - run: python publish/instagram.py queue
      - name: Save queue
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/instagram.csv
          git diff --cached --quiet && exit 0
          git commit -m "Instagram: queue new videos [skip ci]"
          git pull --rebase -q && git push

  post:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'post')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: { group: ig-post, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python publish/instagram.py post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/instagram.csv
          git diff --cached --quiet && exit 0
          git commit -m "Instagram: update post status [skip ci]"
          git pull --rebase -q && git push
